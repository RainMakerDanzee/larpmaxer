<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="LarpMaxer">
  <!--
    Source of truth for the toolbar icon. PNGs in this folder are rendered from
    it (npm run icons); edit here, never the PNGs.

    The mark is the product in one glyph: a form whose lines are being filled
    in, and a tick for the review that gates every submit. Palette is the
    panel's own — ink ground, lime marks — so the toolbar button and the side
    panel read as one thing.

    Drawn heavy, and with only two form lines. A third line was tested and
    removed: at 16px it collided with the tick and the whole mark turned to
    mush. Two bars plus a large tick is the most that survives the toolbar.
  -->
  <rect width="128" height="128" rx="28" fill="#1e1e1e"/>

  <!-- Filled lines. Descending length reads as a form being completed. -->
  <g fill="#d4fa70">
    <rect x="24" y="30" width="80" height="14" rx="7"/>
    <rect x="24" y="58" width="52" height="14" rx="7"/>
  </g>

  <!-- The approval tick that gates every submit. -->
  <path d="M40 92 L60 108 L104 62"
        fill="none" stroke="#d4fa70" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
