<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LarpMaxer — interactive demo</title>
<link rel="stylesheet" href="styles.css">
<style>
  .demo-bar { display:flex; gap:10px; align-items:center; justify-content:center;
    flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid var(--hairline);
    background:var(--paper-warm); }
  .demo-bar span { font:500 10.5px/1.4 var(--font-mono); text-transform:uppercase;
    letter-spacing:.07em; color:var(--ink-3); }
  .demo-bar button { font:500 10.5px/1 var(--font-mono); text-transform:uppercase;
    letter-spacing:.06em; background:transparent; border:1px solid var(--hairline);
    color:var(--ink-2); border-radius:999px; padding:5px 10px; cursor:pointer; }
  .demo-bar button:hover { border-color:var(--ink-3); }
</style>
</head>
<body>
<div class="demo-bar">
  <span>Interactive demo · real UI, simulated browser</span>
  <button onclick="larpmaxerDemoReset()">Reset demo data</button>
</div>
<div id="app"></div>
<script src="demo-shim.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
