<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Application for Software Engineer at Acme Corp</title>
</head>
<body>
  <div id="wrapper">
    <div id="header">
      <h1 class="app-title">Software Engineer</h1>
      <span class="company-name">at Acme Corp</span>
      <div class="location">Sydney, Australia</div>
    </div>
    <div id="content">
      <p>Acme builds delightful infrastructure. We are hiring a Software Engineer to join our platform team in Sydney.</p>
    </div>
    <div id="application">
      <h2>Apply for this Job</h2>
      <span class="asterisk-info"><span class="asterisk">*</span> Required</span>
      <form id="application_form" accept-charset="UTF-8" method="post">
        <div class="field">
          <label for="first_name">First Name <span class="asterisk">*</span></label>
          <input type="text" id="first_name" name="job_application[first_name]" required aria-required="true">
        </div>
        <div class="field">
          <label for="last_name">Last Name <span class="asterisk">*</span></label>
          <input type="text" id="last_name" name="job_application[last_name]" required aria-required="true">
        </div>
        <div class="field">
          <label for="email">Email <span class="asterisk">*</span></label>
          <input type="email" id="email" name="job_application[email]" required aria-required="true">
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input type="text" id="phone" name="job_application[phone]">
        </div>
        <div class="field" id="resume_fieldset">
          <label for="resume">Resume/CV <span class="asterisk">*</span></label>
          <input type="file" id="resume" name="job_application[resume]" aria-required="true" accept=".pdf,.doc,.docx,.txt,.rtf">
        </div>
        <div class="field">
          <label for="question_100">Why do you want to work here?</label>
          <textarea id="question_100" name="job_application[answers_attributes][0][text_value]" rows="5"></textarea>
        </div>
        <div class="field">
          <label for="question_101">How did you hear about us? <span class="asterisk">*</span></label>
          <select id="question_101" name="job_application[answers_attributes][1][answer_selected_options_attributes][0][question_option_id]" required>
            <option value=""></option>
            <option value="9001">LinkedIn</option>
            <option value="9002">Referral</option>
          </select>
        </div>
        <div class="field">
          <label>Which locations are you open to?</label>
          <label class="checkbox-option"><input type="checkbox" id="question_102_0" name="job_application[answers_attributes][2][answer_selected_options_attributes][0][question_option_id]" value="9101"> Sydney</label>
          <label class="checkbox-option"><input type="checkbox" id="question_102_1" name="job_application[answers_attributes][2][answer_selected_options_attributes][1][question_option_id]" value="9102"> Melbourne</label>
        </div>
        <div id="submit_buttons">
          <input type="submit" id="submit_app" value="Submit Application">
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('application_form').addEventListener('submit', function (e) {
      e.preventDefault();
      var app = document.getElementById('application');
      app.innerHTML = '<h2>Thank you for applying</h2>' +
        '<p>Your application has been received. We will be in touch.</p>';
    });
  </script>
</body>
</html>
