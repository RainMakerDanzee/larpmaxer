<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Product Engineer @ Acme</title>
</head>
<body>
  <div id="root">
    <div class="ashby-job-posting-heading">
      <h1>Product Engineer</h1>
      <p>Sydney &middot; Full time</p>
    </div>
    <div class="ashby-application-form-container">
      <section class="ashby-application-form-autofill">
        <h2>Autofill application</h2>
        <p>Upload your resume to autofill the application.</p>
        <!-- Decoy: the FIRST file input on an Ashby page is the autofill widget, not the resume field. -->
        <input type="file" id="autofill-file-input" aria-label="Upload file">
      </section>
      <div class="ashby-application-form">
        <div class="_fieldEntry_x1y2z">
          <label for="_systemfield_name">Name</label>
          <input id="_systemfield_name" type="text" aria-required="true" placeholder="Your full name">
        </div>
        <div class="_fieldEntry_x1y2z">
          <label for="_systemfield_email">Email</label>
          <input id="_systemfield_email" type="email" aria-required="true">
        </div>
        <div class="_fieldEntry_x1y2z">
          <label for="_systemfield_phone">Phone</label>
          <input id="_systemfield_phone" type="tel">
        </div>
        <div class="_fieldEntry_x1y2z">
          <label for="_systemfield_location">Location</label>
          <input id="_systemfield_location" role="combobox" aria-label="Location" aria-required="true" aria-expanded="false" placeholder="Start typing...">
        </div>
        <div class="_fieldEntry_x1y2z">
          <label for="_systemfield_resume">Resume</label>
          <input id="_systemfield_resume" type="file" aria-required="true">
        </div>
        <div class="_fieldEntry_x1y2z" id="q_workrights">
          <label id="q_workrights_label">Do you have Australian work rights?</label>
          <div role="group" aria-labelledby="q_workrights_label">
            <button type="button" aria-pressed="false">Yes</button>
            <button type="button" aria-pressed="false">No</button>
          </div>
        </div>
        <button class="ashby-application-form-submit-button" type="button">Submit Application</button>
      </div>
    </div>
  </div>
</body>
</html>
