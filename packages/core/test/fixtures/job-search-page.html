<!--
  A job-board SEARCH RESULTS page, modelled on the SEEK page that LarpMaxer
  wrongly offered as fillable on 2026-08-28: it presented the "Pay" refinement
  select and the "Strong applicant jobs" toggle as questions for the user.

  Nothing here is an application. The generic adapter must refuse this page.
-->
<div id="page">
  <header>
    <a href="/">SEEK</a>
    <button type="button">Open app</button>
  </header>

  <form role="search" id="search-bar">
    <label for="keywords">What</label>
    <input type="search" id="keywords" name="keywords" value="technology sales" placeholder="Enter keywords" />
    <label for="where">Where</label>
    <input type="text" id="where" name="where" value="Australia" placeholder="Enter suburb, city, or region" />
    <button type="submit">SEEK</button>
  </form>

  <nav aria-label="Refine results">
    <label for="pay-refine">Show salary range refinements.Pay</label>
    <select id="pay-refine" name="salaryrange">
      <option value="">Show salary range refinements.Pay</option>
      <option value="0-60000">$0 - $60,000</option>
      <option value="60000-80000">$60,000 - $80,000</option>
    </select>

    <label for="worktype">Type</label>
    <select id="worktype" name="worktype">
      <option value="">Any</option>
      <option value="242">Full time</option>
    </select>

    <label for="listing-time">Listing time</label>
    <select id="listing-time" name="daterange">
      <option value="">Any time</option>
      <option value="1">Today</option>
    </select>

    <label for="strong-applicant">Strong applicant jobs</label>
    <input type="checkbox" id="strong-applicant" name="strongApplicant" />
  </nav>

  <main>
    <h1>8,409 jobs</h1>
    <button type="button">Save this search</button>

    <article>
      <a href="/job/1">Sales Development Representative (Software - Entry-Level - Hybrid)</a>
      <span>Earlywork Careers Pty Ltd</span>
      <span>Melbourne VIC (Hybrid)</span>
      <a href="/job/1/apply">Quick apply</a>
    </article>

    <article>
      <a href="/job/2">Enterprise Account Executive</a>
      <span>Example Pty Ltd</span>
      <a href="/job/2/apply">Quick apply</a>
    </article>
  </main>

  <footer>
    <label for="alert-email">Get new jobs by email</label>
    <input type="email" id="alert-email" name="alertEmail" placeholder="you@example.com" />
    <button type="submit">Create alert</button>
  </footer>
</div>
