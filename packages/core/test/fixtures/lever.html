<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acme Corp - Data Engineer</title>
</head>
<body class="application-page">
  <div class="section-wrapper accent-section">
    <div class="section page-centered posting-header">
      <h2>Data Engineer</h2>
      <div class="posting-categories">
        <div class="sort-by-time posting-category">Sydney, Australia</div>
      </div>
    </div>
  </div>
  <div class="section-wrapper application-form-page">
    <div class="section page-centered application-form">
      <h4>Submit your application</h4>
      <form id="application-form" class="application-form" method="post" action="https://jobs.lever.co/acme/f1e2d3c4-b5a6/apply">
        <input type="hidden" name="csrf" value="token123">
        <div class="application-field">
          <label class="application-label" for="resume-upload-input">Resume/CV <span class="required">✱</span></label>
          <input id="resume-upload-input" type="file" name="resume" required>
        </div>
        <div class="application-field">
          <label class="application-label" for="name-input">Full name <span class="required">✱</span></label>
          <input id="name-input" type="text" name="name" required>
        </div>
        <div class="application-field">
          <label class="application-label" for="email-input">Email <span class="required">✱</span></label>
          <input id="email-input" type="email" name="email" required>
        </div>
        <div class="application-field">
          <label class="application-label" for="phone-input">Phone</label>
          <input id="phone-input" type="text" name="phone">
        </div>
        <div class="application-field">
          <label class="application-label" for="comments-input">Additional information</label>
          <textarea id="comments-input" name="comments" class="card-field-input"></textarea>
        </div>
        <input type="hidden" name="cards[a1b2c3][baseTemplate]" value="{}">
        <div class="application-field card-field">
          <label class="application-label" for="card_q1">Which timezone are you in? <span class="required">✱</span></label>
          <input id="card_q1" type="text" name="cards[a1b2c3][field0]" required>
        </div>
        <div class="application-field card-field">
          <select name="cards[a1b2c3][field1]" aria-label="Preferred office">
            <option value=""></option>
            <option>Sydney</option>
            <option>Remote</option>
          </select>
        </div>
        <div class="application-actions">
          <button type="submit" class="postings-btn template-btn-submit">Submit application</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
