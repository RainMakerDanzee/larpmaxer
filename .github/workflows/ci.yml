name: CI

on: [push, pull_request]

jobs:
  ci:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: packages/extension/dist
          if-no-files-found: error

  e2e:
    # The engine is covered in Node; this drives the built extension in a real
    # browser — service worker, content script and message protocol together —
    # because nothing else catches a regression in the wiring between them.
    name: end-to-end (real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run e2e
